<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>{{ site.title }}</title>

  <style>
    body {
      max-width: 680px;
      margin: 80px auto;
      padding: 0 24px;
      font-family: Arial, sans-serif;
      font-size: 16px;
      line-height: 1.7;
      color: #302e2a;
      background: #faf8f2;
    }

    h1 {
      font-size: 28px;
      margin-bottom: 8px;
    }

    h2 {
      font-size: 21px;
      margin-top: 36px;
      margin-bottom: 14px;
    }

    a {
      color: #302e2a;
      text-decoration: underline;
      text-underline-offset: 3px;
      text-decoration-thickness: 1px;
    }

    a:hover {
      color: #77736c;
    }

    nav {
      margin: 28px 0;
    }

    nav a {
      text-decoration: none;
    }

    nav a:hover,
    nav a.active {
      text-decoration: underline;
    }

    p {
      margin: 0 0 18px;
    }

    ul {
      padding-left: 24px;
      margin-top: 10px;
      margin-bottom: 22px;
    }

    li {
      margin-bottom: 7px;
    }

    .toggle-section {
      display: none;
    }

    .toggle-section h2:first-child {
      margin-top: 24px;
    }

    .toggle-section ul li {
      margin-bottom: 9px;
    }

    footer {
      margin-top: 64px;
      font-size: 13px;
      color: #777;
    }

    @media (max-width: 600px) {
      body {
        margin: 36px auto;
      }
    }
  </style>
</head>

<body>
  <main>
    {{ content }}
  </main>

  <footer>
    G © {{ site.time | date: "%Y" }} · Made with care
  </footer>

  <script>
    function showSection(sectionId) {
      const selected = document.getElementById(sectionId);
      const wasOpen = selected.style.display === 'block';

      document.querySelectorAll('.toggle-section').forEach(section => {
        section.style.display = 'none';
      });

      document.querySelectorAll('.section-tabs a').forEach(link => {
        link.classList.remove('active');
      });

      if (!wasOpen) {
        selected.style.display = 'block';

        const activeLink = document.querySelector(
          '.section-tabs a[href="#' + sectionId + '"]'
        );

        if (activeLink) {
          activeLink.classList.add('active');
        }
      }
    }
  </script>
</body>
</html>
